<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="shirt-title shirt-description">
  <title id="shirt-title">Astronaut biometric compression shirt</title>
  <desc id="shirt-description">A long-sleeve white technical compression shirt with realistic fabric shading, stitched seams, graphite stretch panels, soft folds, and discreet wearable sensor pads.</desc>
  <defs>
    <linearGradient id="fabric" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".32" stop-color="#f8f9fa"/>
      <stop offset=".72" stop-color="#e9edef"/>
      <stop offset="1" stop-color="#cfd5d9"/>
    </linearGradient>
    <linearGradient id="fabric-side" x1="0" x2="1">
